services:
  backend:
    build: ./backend
    container_name: antique-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: antique-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api
